<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="pg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#04241a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#pg)"/>
  <!-- Padlock Icon -->
  <g transform="translate(300, 130)" filter="url(#glow)">
    <circle cx="0" cy="0" r="50" fill="#34D399" opacity="0.15"/>
    <!-- Lock body -->
    <rect x="-30" y="-15" width="60" height="55" rx="5" fill="none" stroke="#6EE7B7" stroke-width="3"/>
    <!-- Lock shackle -->
    <path d="M -20 -15 Q -20 -35 0 -35 Q 20 -35 20 -15" fill="none" stroke="#6EE7B7" stroke-width="3"/>
    <!-- Keyhole -->
    <circle cx="0" cy="15" r="5" fill="#10B981"/>
  </g>
  <!-- Security Symbols -->
  <g transform="translate(120, 280)" opacity="0.6">
    <circle cx="0" cy="0" r="15" fill="none" stroke="#6EE7B7" stroke-width="2"/>
    <line x1="-5" y1="0" x2="5" y2="0" stroke="#6EE7B7" stroke-width="2"/>
    <line x1="0" y1="-5" x2="0" y2="5" stroke="#6EE7B7" stroke-width="2"/>
  </g>
  <!-- Shield -->
  <g transform="translate(480, 280)" opacity="0.6">
    <path d="M 0 -20 L 20 -10 L 20 5 Q 0 20 0 20 Q -20 20 -20 5 L -20 -10 Z" fill="none" stroke="#6EE7B7" stroke-width="2"/>
    <path d="M -6 0 L 0 6 L 6 0" fill="#6EE7B7"/>
  </g>
  <text x="40" y="370" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="white">Password AI</text>
</svg>