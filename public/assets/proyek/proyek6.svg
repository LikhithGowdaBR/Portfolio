<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="pg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#3a1c04"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#pg)"/>
  <!-- Shopping Bags -->
  <g filter="url(#glow)">
    <!-- Bag 1 -->
    <rect x="130" y="100" width="60" height="70" rx="5" fill="#FB923C" stroke="#FDBA74" stroke-width="2"/>
    <path d="M 150 100 Q 150 80 130 80 Q 130 90 150 90 Q 170 90 170 80 Q 150 80 150 100" fill="#FDBA74"/>
    <line x1="150" y1="100" x2="150" y2="170" stroke="#FDBA74" stroke-width="1.5"/>
    <!-- Bag 2 -->
    <rect x="270" y="120" width="60" height="70" rx="5" fill="#FB923C" stroke="#FDBA74" stroke-width="2"/>
    <path d="M 290 120 Q 290 100 270 100 Q 270 110 290 110 Q 310 110 310 100 Q 290 100 290 120" fill="#FDBA74"/>
    <!-- Bag 3 -->
    <rect x="410" y="100" width="60" height="70" rx="5" fill="#FB923C" stroke="#FDBA74" stroke-width="2"/>
    <path d="M 430 100 Q 430 80 410 80 Q 410 90 430 90 Q 450 90 450 80 Q 430 80 430 100" fill="#FDBA74"/>
  </g>
  <!-- Grid of Products -->
  <g opacity="0.5" stroke="#FDBA74" stroke-width="1.5" fill="none">
    <rect x="100" y="230" width="50" height="50" rx="3"/>
    <rect x="170" y="230" width="50" height="50" rx="3"/>
    <rect x="240" y="230" width="50" height="50" rx="3"/>
    <rect x="310" y="230" width="50" height="50" rx="3"/>
    <rect x="380" y="230" width="50" height="50" rx="3"/>
    <rect x="450" y="230" width="50" height="50" rx="3"/>
  </g>
  <text x="40" y="370" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="white">Amazon Clone</text>
</svg>