<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="pg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#1a0b3a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#pg)"/>
  <!-- Microphone Icon -->
  <g transform="translate(300, 120)" filter="url(#glow)">
    <circle cx="0" cy="0" r="45" fill="#C084FC" opacity="0.15"/>
    <!-- Mic body -->
    <rect x="-15" y="-20" width="30" height="35" rx="15" fill="none" stroke="#DDD6FE" stroke-width="3"/>
    <!-- Mic bottom -->
    <circle cx="0" cy="20" r="8" fill="none" stroke="#DDD6FE" stroke-width="3"/>
    <!-- Sound waves -->
    <circle cx="0" cy="0" r="8" fill="#DDD6FE" opacity="0.8"/>
  </g>
  <!-- Sound Wave Lines -->
  <g transform="translate(300, 120)" opacity="0.6" stroke="#C084FC" stroke-width="2" fill="none">
    <circle cx="0" cy="0" r="25" opacity="0.7"/>
    <circle cx="0" cy="0" r="35" opacity="0.5"/>
  </g>
  <!-- Speaker Icon Left -->
  <g transform="translate(100, 280)" opacity="0.5">
    <path d="M 0 -15 L 15 -10 L 15 10 L 0 15 Z" fill="#C084FC" stroke="#DDD6FE" stroke-width="1.5"/>
    <path d="M 20 -8 Q 25 -5 25 0 Q 25 5 20 8" fill="none" stroke="#DDD6FE" stroke-width="2"/>
  </g>
  <!-- Speaker Icon Right -->
  <g transform="translate(500, 280)" opacity="0.5">
    <path d="M 0 -15 L -15 -10 L -15 10 L 0 15 Z" fill="#C084FC" stroke="#DDD6FE" stroke-width="1.5"/>
    <path d="M -20 -8 Q -25 -5 -25 0 Q -25 5 -20 8" fill="none" stroke="#DDD6FE" stroke-width="2"/>
  </g>
  <text x="40" y="370" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="white">Jarvis AI</text>
</svg>