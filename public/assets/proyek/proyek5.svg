<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="pg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#3a2504"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#pg)"/>
  <!-- Currency Symbols -->
  <g filter="url(#glow)">
    <!-- Dollar Sign Left -->
    <text x="120" y="180" font-family="Arial" font-size="80" font-weight="bold" fill="#FBBF24" opacity="0.9">$</text>
    <!-- Euro Sign Right -->
    <text x="380" y="180" font-family="Arial" font-size="80" font-weight="bold" fill="#FBBF24" opacity="0.9">€</text>
  </g>
  <!-- Exchange Arrow -->
  <g transform="translate(300, 200)" opacity="0.7" stroke="#FCD34D" stroke-width="3" fill="none" stroke-linecap="round">
    <line x1="-80" y1="0" x2="80" y2="0"/>
    <polygon points="85,0 70,-8 70,8" fill="#FCD34D"/>
  </g>
  <!-- Currency Coins -->
  <g opacity="0.5">
    <circle cx="150" cy="300" r="15" fill="none" stroke="#FBBF24" stroke-width="2"/>
    <text x="145" y="307" font-family="Arial" font-size="16" fill="#FBBF24" font-weight="bold">$</text>
    <circle cx="450" cy="300" r="15" fill="none" stroke="#FBBF24" stroke-width="2"/>
    <text x="443" y="307" font-family="Arial" font-size="16" fill="#FBBF24" font-weight="bold">€</text>
  </g>
  <text x="40" y="370" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="white">Currency Converter</text>
</svg>