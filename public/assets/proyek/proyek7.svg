<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="pg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#3a0b26"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#pg)"/>
  <!-- Rock (Fist) -->
  <g transform="translate(150, 150)" filter="url(#glow)">
    <circle cx="0" cy="0" r="35" fill="#FCA5A5" opacity="0.2"/>
    <ellipse cx="0" cy="-5" rx="12" ry="18" fill="#FECACA" stroke="#FCA5A5" stroke-width="2"/>
    <rect x="-15" y="5" width="30" height="25" rx="5" fill="#FECACA" stroke="#FCA5A5" stroke-width="2"/>
  </g>
  <!-- Paper (Open Hand) -->
  <g transform="translate(300, 120)" filter="url(#glow)">
    <circle cx="0" cy="0" r="35" fill="#FCA5A5" opacity="0.2"/>
    <rect x="-18" y="-10" width="36" height="40" rx="3" fill="#FECACA" stroke="#FCA5A5" stroke-width="2"/>
    <line x1="-10" y1="-10" x2="-10" y2="30" stroke="#FCA5A5" stroke-width="1.5"/>
    <line x1="0" y1="-10" x2="0" y2="30" stroke="#FCA5A5" stroke-width="1.5"/>
    <line x1="10" y1="-10" x2="10" y2="30" stroke="#FCA5A5" stroke-width="1.5"/>
  </g>
  <!-- Scissors (Two Fingers) -->
  <g transform="translate(450, 150)" filter="url(#glow)">
    <circle cx="0" cy="0" r="35" fill="#FCA5A5" opacity="0.2"/>
    <circle cx="-8" cy="-8" r="6" fill="none" stroke="#FECACA" stroke-width="2.5"/>
    <circle cx="8" cy="-8" r="6" fill="none" stroke="#FECACA" stroke-width="2.5"/>
    <line x1="-8" y1="-2" x2="8" y2="18" stroke="#FECACA" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="8" y1="-2" x2="-8" y2="18" stroke="#FECACA" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <!-- VS Text -->
  <text x="285" y="240" font-family="Arial" font-size="24" font-weight="bold" fill="#FECACA" opacity="0.7" text-anchor="middle">VS</text>
  <text x="40" y="370" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="white">Rock Paper Scissors</text>
</svg>